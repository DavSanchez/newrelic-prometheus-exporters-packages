name: e2e Agent Control

# Checks that the nri-mongodb3 package and its Agent Control agent type work together by deploying them
# in a real Agent Control. See https://github.com/newrelic/newrelic-agent-control/pull/2998
on:
  workflow_dispatch:
    inputs:
      agent_control_version:
        description: 'Agent Control version to install (empty uses the install recipe default)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  GORELEASER_VERSION: 'v1.13.1'

jobs:
  e2e-agent-control:
    name: Agent Control e2e for mongodb3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: nri-config-generator/go.mod
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Build nri-mongodb3 and mongodb3-exporter
        run: make build-mongodb3
      - name: Create the package
        # Both binaries are placed at the root of the archive, the agent type reads them from there.
        run: |
          tar czf nri-mongodb3.tar.gz \
            -C exporters/mongodb3/target/bin/linux_amd64 nri-mongodb3 mongodb3-exporter
      - name: Start MongoDB
        working-directory: exporters/mongodb3/e2e
        run: docker compose -f docker-compose-standalone-v7.yml up -d
      # TODO: pin to a released ref once the action is merged
      - uses: newrelic/newrelic-agent-control/.github/actions/test-ohi-agent@gsanchez/feat/e2e-action
        with:
          agent-type-file: .fleetControl/agentControl/linux.yml
          package-file: nri-mongodb3.tar.gz
          config-file: exporters/mongodb3/e2e/agent-control-config.yml
          nrql-assertion: "SELECT count(mongodb_dbstats_ok) FROM Metric WHERE `test.id` = '{{test_id}}'"
          nr-license-key: ${{ secrets.COREINT_E2E_LICENSE_KEY }}
          nr-api-key: ${{ secrets.COREINT_E2E_API_KEY }}
          nr-account-id: ${{ secrets.COREINT_E2E_ACCOUNT_ID }}
          agent-control-version: ${{ inputs.agent_control_version }}
