name: Publish nri-mongodb3 to Agent Control catalog

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to process (e.g., nri-mongodb3-3.1.8)'
        required: true
        type: string
  release:
    types:
      - released

permissions:
  contents: read

jobs:
  oci-publish:
    # This repository releases several exporters, only publish mongodb3 ones.
    if: startsWith(github.event.release.tag_name || inputs.tag, 'nri-mongodb3-')
    uses: newrelic/coreint-automation/.github/workflows/reusable_agent_control_release.yaml@v3
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      agent_type: NRIMongodb3
      display_name: "MongoDB"
      monitoring_type: "INFRA"
      oci_registry: "docker.io/newrelic/nri-mongodb3-artifacts"
      artifacts: |
        [
          {"name":"linux-amd64","os":"linux","arch":"amd64","format":"tar+gzip","source_asset":"nri-mongodb3_linux_{version}_amd64.tar.gz","source_format":"tar.gz","keep_files":["var/db/newrelic-infra/newrelic-integrations/bin/nri-mongodb3","usr/local/prometheus-exporters/bin/mongodb3-exporter"]},
          {"name":"linux-arm64","os":"linux","arch":"arm64","format":"tar+gzip","source_asset":"nri-mongodb3_linux_{version}_arm64.tar.gz","source_format":"tar.gz","keep_files":["var/db/newrelic-infra/newrelic-integrations/bin/nri-mongodb3","usr/local/prometheus-exporters/bin/mongodb3-exporter"]}
        ]
    secrets:
      OHAI_NEWRELIC_CLIENT_ID: ${{ secrets.OHAI_NEWRELIC_CLIENT_ID }}
      OHAI_NEWRELIC_PRIVATE_KEY: ${{ secrets.OHAI_NEWRELIC_PRIVATE_KEY }}
      OHAI_OCI_USERNAME: ${{ secrets.OHAI_OCI_USERNAME }}
      OHAI_OCI_PASSWORD: ${{ secrets.OHAI_OCI_PASSWORD }}
      AGENT_METADATA_ACTION_LICENSE_KEY: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }}
